contract_version: '2.0'
contract_id: SYSTEM_ARCHITECTURE_CONTRACT
status: ACTIVE
# 2.0 merges the former MEMORY_PATH_CONTRACT.yaml. The reference device is defined in
# contracts/HARDWARE_PLATFORM_CONTRACT.yaml; timing field names follow AI_CONTROL/AI_TIME_MEASUREMENT_POLICY.md.
architecture_id: CPU_PROGRAM_FPGA_SHARED_CACHE_DATA_PATH
device_contract: contracts/HARDWARE_PLATFORM_CONTRACT.yaml
assumptions:
  control_plane:
    owner: CPU
    responsibilities:
    - FPGA_programming_configuration
    - benchmark_invocation
    - lifecycle_control
    - timing_measurement
  data_plane:
    producer_consumer:
    - CPU_or_system_memory
    - shared_cache
    - FPGA_accelerator
    data_source: shared_cache
    direct_ddr_access: NOT_ASSUMED
  fpga:
    receives_data_from: shared_cache
  configuration:
    initiated_by: CPU
    programming_time_required_when_programmed: true
    partial_reconfiguration: OPTIONAL_STUDY
interfaces:
  control: MUST_BE_DECLARED_AND_MEASURED
  m_axi: UNKNOWN_UNTIL_MEASURED      # identified from the actual block design and generated artifacts
  acp: UNKNOWN_UNTIL_MEASURED        # declared from the actual hardware design
  dma: UNKNOWN_UNTIL_MEASURED
  cache_level: MUST_BE_DECLARED
  cache_coherence: MUST_BE_DECLARED
  result_return_path: MUST_BE_DECLARED
required_measurements:
  configuration:
  - t_program_s
  - t_init_s
  - n_program
  - bitstream_size_bytes
  data_path:
  - cache_hit_rate
  - cache_miss_rate
  - cache_bytes_read
  - cache_bytes_written
  - data_ready_wait_s
  - fpga_data_consumption_s
  - contention_wait_s
  - memory_bandwidth_Bps
  system:
  - cpu_control_overhead_s
  - t_execution_s
  - end_to_end_latency_s
  - n_invocation
  - lifecycle_time_s
forbidden_assumptions:
- infer_dma_from_api_calls
- infer_cache_hit_rate_without_hardware_measurement
- equate_kernel_latency_with_end_to_end_latency
- estimate_programming_time_as_measured_data
- assume_m_axi_without_hardware_evidence
- assume_acp_without_hardware_evidence
architecture_questions:
- Does cache behavior change configuration/search decisions?
- Does CPU programming overhead change the preferred design?
- Does shared-cache contention change ranking among candidates or benchmarks?
- Does lifecycle-optimal DSE differ from kernel-latency-optimal DSE?

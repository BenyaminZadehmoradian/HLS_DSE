supersession:
  - old_study_id: S09
    current_status: ARCHIVED
    replacement_study_id: S71
    reason: "External-baseline reproduction was first registered under S09 (V22.6), colliding with the earlier S09 meaning; moved to the immutable ID S71."
    source: "archive/legacy_study_ids/S09_EXTERNAL_BASELINE_V22_6_CONTRACT.yaml; RESEARCH_STATE.yaml external_baseline_study; studies/S09/CONTRACT.yaml status ARCHIVED_ID_COLLISION"
    other_historical_meanings: "Model/Learning efficiency (R03, R06 §19 before 1.1 correction); Multi-fidelity evidence (R07 §27). No replacement ID is defined for these in canonical sources."
historical_meaning_drift:
  - ids: S07-S27
    note: "The R07 §27 study map (now archive/V19/HLS_DSE_V19_RESEARCH_MASTER.md) is an older study map whose S07-S27 meanings differ from R06 §19. Per the R06 registry rule, R06 §19 records the current role and historical definitions remain in archive/V19/. No ID was reassigned by this registry."

# Studies whose questions overlap but are not identical. Status is unchanged: which study keeps the question
# (and whether the others are SUPERSEDED or narrowed) is a research decision for the researcher.
overlap_review:
  - {studies: [S07, S65], topic: "joint candidate / task-candidate-fidelity selection", decision: PENDING_HUMAN}
  - {studies: [S21, S23], topic: "adaptive fidelity", decision: PENDING_HUMAN}
  - {studies: [S32, S34, S88], topic: "early stopping / staged evaluation termination", decision: PENDING_HUMAN}
  - {studies: [S26, S87], topic: "provenance storage / evidence reuse", decision: PENDING_HUMAN}

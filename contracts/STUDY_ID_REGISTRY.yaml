policy: Never reuse an existing Study ID for a different scientific question.

status_vocabulary: [ACTIVE, PLANNED, RESERVED, DEPRECATED, SUPERSEDED, ARCHIVED, MISSING_DEFINITION, UNKNOWN]
status_definitions:
  ACTIVE: "Study currently executing (none: P0 not started)."
  PLANNED: "Study has a named contract (studies/<ID>/CONTRACT.yaml with study_name) and is gated; not started."
  RESERVED: "ID and canonical role recorded (R06 §19) with a registry_only contract stub; no executable definition yet."
  ARCHIVED: "Historical ID retained for traceability; no new execution."
  MISSING_DEFINITION: "ID allocated (stub folder exists) but no definition exists in any canonical source."
